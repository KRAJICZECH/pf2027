<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PF 2027 KRAJICZECH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,800;1,500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="snow" aria-hidden="true"></canvas>

<div class="stage">
  <main class="scene" id="scene">
    <div class="env env-back" aria-hidden="true"></div>

    <div class="lift">
      <div class="book" id="book" data-state="0" role="button" tabindex="0" aria-label="Otočit přání">
        <!-- leaf 2: letter (front) / back cover (back) -->
        <div class="leaf" id="leaf2" style="z-index:2">
          <section class="face front letter" id="letter" aria-live="polite">
            <p class="hello" id="hello"></p>
            <p data-t="p1"></p>
            <p data-t="p2"></p>
            <p class="sign"><span data-t="regards"></span><b data-t="team"></b></p>
          </section>
          <section class="face back backcover">
            <span class="wordmark" aria-label="KRAJICZECH">KRAJICZ<span class="e" aria-hidden="true"><i></i><i></i><i></i></span>CH</span>
            <span class="rule" aria-hidden="true"></span>
            <small>www.krajiczech.cz</small>
          </section>
        </div>

        <!-- leaf 1: cover (front) / decorated inside (back) -->
        <div class="leaf" id="leaf1" style="z-index:3">
          <section class="face front cover" id="cover">
            <span class="wordmark" aria-label="KRAJICZECH">KRAJICZ<span class="e" aria-hidden="true"><i></i><i></i><i></i></span>CH</span>
            <div class="mark" aria-hidden="true">
              <span class="star"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.7-6.2 3.7 1.6-7L2 8.7l7.1-.6z"/></svg></span>
              <span class="bar b1"></span><span class="bar b2"></span><span class="bar b3"></span>
              <span class="trunk"></span>
            </div>
            <div class="cover-text">
              <span class="eyebrow">PF 2027</span>
              <h1><span data-t="title1"></span><span data-t="title2"></span></h1>
            </div>
          </section>
          <section class="face back deco" id="deco" aria-hidden="true">
            <span class="pf">PF<br><em>2027</em></span>
          </section>
        </div>
      </div>
    </div>

    <div class="env env-front" aria-hidden="true">
      <div class="env-label">
        <small data-t="forYou"></small>
        <span class="wordmark">KRAJICZ<span class="e"><i></i><i></i><i></i></span>CH</span>
      </div>
    </div>
    <div class="env env-flap" aria-hidden="true">
      <div class="flap-face flap-out"></div>
      <div class="flap-face flap-in"></div>
    </div>
  </main>

  <nav class="controls hide" id="controls" aria-label="Ovládání přání">
    <button type="button" class="nav" id="prev" aria-label="Zpět"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="hint" id="hint"></span>
    <button type="button" class="nav" id="next" aria-label="Dál"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </nav>
</div>

<script src="script.js"></script>
</body>
</html>
